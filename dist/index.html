<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1230">
<meta name="description" content="Bonehead: a pixel-art shedding roguelite. Lose your cards. Don't be the Bonehead.">
<title>Bonehead</title>
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #07060d; overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #view { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #f1e5ca; font: 700 14px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .2em; transition: opacity .4s; pointer-events: none; }
  body.ready #boot { opacity: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<canvas id="view" aria-label="Bonehead card game" role="application" tabindex="0"></canvas>
<div id="boot">SHUFFLING…</div>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p style="color:#fff;font-family:monospace;padding:2em">Bonehead needs JavaScript to deal the cards.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
